name: 台风路径卡片推送

on:
  schedule:
    - cron: "23 */3 * * *"      # 每 3 小时（UTC）
  workflow_dispatch: {}          # 允许手动触发测试

permissions:
  contents: read

jobs:
  push-card:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 推送台风路径模板卡片
        env:
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
          TYPHOON_PATH_URL: ${{ secrets.TYPHOON_PATH_URL }}
        run: python push_typhoon_card.py --with-image
