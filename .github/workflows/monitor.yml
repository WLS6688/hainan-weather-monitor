name: 海南台风预警监控

on:
  schedule:
    # 全部避开整点：GitHub Actions 在「每小时整点」负载最高，schedule 事件会被延迟数小时
    # 甚至直接丢弃（实测本仓库曾出现单次延迟 5 小时、以及连续 2 小时零执行的情况）。
    - cron: "3,13,23,33,43,53 * * * *"  # 每 10 分钟轮询（跳过整点，避开负载高峰）
    # 每日报告改到上班前：北京时间 07:30 发，出门前就能看到当天预警和天气。
    # 冗余触发 08:30 兜一次；再不行还有 DAILY_CATCHUP_AFTER 之后的每轮 poll 补发。
    - cron: "30 23 * * *"               # 主触发：北京时间 07:30（UTC 23:30）
    - cron: "30 0 * * *"                # 冗余触发：北京时间 08:30（UTC 00:30），靠 last_daily_report_date 去重
  workflow_dispatch:                    # 手动触发 / 供外部定时服务调用（备选方案入口）
    inputs:
      mode:
        description: 运行模式
        type: choice
        options:
          - poll
          - daily
        default: poll

permissions:
  contents: write            # 用于把 state.json 提交回仓库（持久化去重）
  actions: read              # 用于并发自检：查询是否已有另一个 run 正在运行

# 同一时刻只允许一个 run 推进，避免并发写 state.json 造成状态互相覆盖
concurrency:
  group: hainan-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    # 5 分钟偏紧：pip 安装 matplotlib + 预警接口指数退避重试（3 个 adcode）+ nmc 台风接口多次调用，
    # 网络较慢时可能超时（超时会导致状态不落盘 -> 下轮重复推送），故放宽到 10 分钟
    timeout-minutes: 10
    steps:
      # v7：node24 运行时（消除 Node 20 弃用告警）
      # persist-credentials 显式开启：commit_state() 依赖它用内置 GITHUB_TOKEN 把 state.json 推回仓库
      - uses: actions/checkout@v7
        with:
          # ref: main —— 关键。不写 ref 时 checkout 签出的是「触发本次 run 时记录的 SHA」，
          # 两个 run 重叠执行时会拿到同一份旧 state.json，各自判定某条预警"解除"而重复推送
          #（实测 2026-10-06 04:52 双发）。指定 main 才能签出最新代码 + 最新 state。
          ref: main
          fetch-depth: 1
          persist-credentials: true

      # 缓存 pip：每轮省下 10~20 秒的 matplotlib 安装时间，降低排队与超时概率
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-mpl
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 安装依赖
        run: python3 -m pip install --quiet matplotlib

      # 网络层使用标准库 urllib；matplotlib 用于生成台风路径图（中文字体已随仓库提供）
      # ⚠️ 修改上面的 cron 表达式时，下面的判断串必须同步修改，
      #    否则每日报告会静默降级为普通轮询（不发日报也不报错）
      - name: 运行监控
        env:
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
          # 并发自检用：GITHUB_RUN_ID / GITHUB_REPOSITORY 由 Actions 自动注入，无需声明
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sched="${{ github.event.schedule }}"
          input_mode="${{ github.event.inputs.mode }}"
          if [ "$input_mode" = "daily" ] || [ "$sched" = "30 23 * * *" ] || [ "$sched" = "30 0 * * *" ]; then
            python3 monitor.py --mode daily
          else
            python3 monitor.py --mode poll
          fi
